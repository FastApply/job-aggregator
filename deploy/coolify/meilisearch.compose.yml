# Coolify resource: "Docker Compose Empty" -> paste this. Turn on "Connect to Predefined Network"
# and leave the domain EMPTY: Meili's only auth is the master key, so it must stay on the internal
# Docker network. Apps reach it as http://meilisearch-<resource-uuid>:7700.
services:
  meilisearch:
    image: getmeili/meilisearch:v1.37   # same version Render ran; bump deliberately, not in passing
    restart: unless-stopped
    environment:
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY}   # set in Coolify env; generate: openssl rand -hex 32
      - MEILI_ENV=production
      - MEILI_NO_ANALYTICS=true
      # Sized for the 32GB box: the full ~9.5M-job backfill peaked around 8GB resident.
      - MEILI_MAX_INDEXING_MEMORY=12Gb
      - MEILI_MAX_INDEXING_THREADS=6
    volumes:
      - meili_data:/meili_data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:7700/health"]
      interval: 15s
      timeout: 5s
      retries: 5
volumes:
  meili_data:
